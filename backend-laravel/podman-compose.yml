version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb_service
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: laravel_mongo_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_backend
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - DB_CONNECTION=mongodb
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_DATABASE=laravel_mongo_db
      - DB_URI=mongodb://mongodb:27017

volumes:
  mongo_data:
